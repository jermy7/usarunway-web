name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site-v2/package-lock.json
            site-v3/package-lock.json
            site-v4/package-lock.json
            site-v5/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
      - run: npm ci && npm run build
        working-directory: site-v2
      - run: npm ci && npm run build
        working-directory: site-v3
      - run: npm ci && npm run build
        working-directory: site-v4
      - run: npm ci && npm run build
        working-directory: site-v5
      - name: Assemble pages (v1 at root, v2-v5 under /v2 ... /v5)
        run: |
          mkdir -p _pages/v2 _pages/v3 _pages/v4 _pages/v5
          cp -r site/dist/. _pages/
          cp -r site-v2/dist/. _pages/v2/
          cp -r site-v3/dist/. _pages/v3/
          cp -r site-v4/dist/. _pages/v4/
          cp -r site-v5/dist/. _pages/v5/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
